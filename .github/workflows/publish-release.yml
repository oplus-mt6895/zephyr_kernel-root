name: Zephyr Release Publisher

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Zephyr build run ID
        required: true
        type: string
      run_number:
        description: Completed Zephyr build run number
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: zephyr-kernel-${{ inputs.run_number }}
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}

      - name: Inspect release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(find artifact -type f -name TAG -print -quit)"
          TITLE="$(find artifact -type f -name TITLE -print -quit)"
          ZIP_NAME="$(find artifact -type f -name ZIP_NAME -print -quit)"
          RELEASE_MD="$(find artifact -type f -name RELEASE.md -print -quit)"
          ROOT="$(find artifact -type f -name ROOT -print -quit)"
          ZIP="$(find artifact -type f -name '*.zip' -print -quit)"
          test -n "$TAG" -a -n "$TITLE" -a -n "$ZIP_NAME" -a -n "$RELEASE_MD" -a -n "$ROOT" -a -n "$ZIP"
          echo "tag=$(cat "$TAG")" >> "$GITHUB_OUTPUT"
          echo "title=$(cat "$TITLE")" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(cat "$ZIP_NAME")" >> "$GITHUB_OUTPUT"
          echo "release_md=$RELEASE_MD" >> "$GITHUB_OUTPUT"
          echo "root=$(cat "$ROOT")" >> "$GITHUB_OUTPUT"

      - name: Resolve build commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.run_id }}" --jq '.head_sha')"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          ZIP: ${{ steps.meta.outputs.zip }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          NOTES: ${{ steps.meta.outputs.release_md }}
          SHA: ${{ steps.run.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" "$ZIP" \
              --target "$SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES"
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ZIP_NAME"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> "$GITHUB_ENV"

      - name: Notify Telegram — published
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_NUMBER: ${{ inputs.run_number }}
          ROOT_IMPL: ${{ steps.meta.outputs.root }}
          RELEASE_URL: ${{ env.RELEASE_URL }}
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
        run: |
          python3 scripts/telegram_notify.py published

      - name: Notify Telegram — publish failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_NUMBER: ${{ inputs.run_number }}
          ROOT_IMPL: ${{ steps.meta.outputs.root }}
        run: |
          python3 scripts/telegram_notify.py failure
